<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sin conexión — Teia Bakery</title>
<meta name="robots" content="noindex" />
<!-- Página de cortesía que muestra la app instalada cuando no hay internet. A propósito no tiene
     ningún dato: ni precios, ni catálogo, ni pedidos. Estilos en línea porque tiene que poder
     mostrarse aunque no haya red para bajar la hoja de estilos. -->
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #F4ECDE; color: #33291F; padding: 24px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .caja { max-width: 380px; text-align: center; }
  .marca { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #A89681; margin: 0 0 22px; }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 1.55; color: #7C6D5C; margin: 0; }
</style>
</head>
<body>
  <div class="caja">
    <p class="marca">Teia Bakery</p>
    <h1>Sin conexión</h1>
    <p>No pudimos conectarnos. Revisá tu internet y volvé a intentar: la app se actualiza sola apenas vuelva la señal.</p>
  </div>
</body>
</html>
